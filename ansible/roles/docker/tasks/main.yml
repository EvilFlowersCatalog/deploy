# Docker Engine and the Compose plugin from Docker's own repository.
- name: Packages for the Docker repository
  ansible.builtin.apt:
    name: [ca-certificates, curl, rsync]
    update_cache: true
    cache_valid_time: 3600

- name: Docker's repository
  ansible.builtin.deb822_repository:
    name: docker
    uris: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
    suites: ["{{ ansible_distribution_release }}"]
    components: [stable]
    architectures: ["{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"]
    signed_by: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"

- name: Docker Engine and Compose
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    update_cache: true
    state: present

- name: Docker running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
