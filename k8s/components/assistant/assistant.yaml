apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 60Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels: {app.kubernetes.io/name: ollama, app.kubernetes.io/part-of: elvira}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: ollama}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ollama, app.kubernetes.io/part-of: elvira}
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.40.15
          env:
            - {name: OLLAMA_KEEP_ALIVE, value: "-1"}
            - {name: OLLAMA_CONTEXT_LENGTH, value: "32768"}
            - {name: OLLAMA_FLASH_ATTENTION, value: "1"}
          ports:
            - {name: http, containerPort: 11434}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10}
          volumeMounts:
            - {name: ollama, mountPath: /root/.ollama}
      volumes:
        - name: ollama
          persistentVolumeClaim: {claimName: ollama}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector: {app.kubernetes.io/name: ollama}
  ports:
    - {name: http, port: 11434, targetPort: http}
