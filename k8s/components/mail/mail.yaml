apiVersion: apps/v1
kind: Deployment
metadata:
  name: maildev
  labels: {app.kubernetes.io/name: maildev, app.kubernetes.io/part-of: elvira}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: maildev}
  template:
    metadata:
      labels: {app.kubernetes.io/name: maildev, app.kubernetes.io/part-of: elvira}
    spec:
      containers:
        - name: maildev
          image: maildev/maildev:2.2.1
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: http, containerPort: 1080}
---
apiVersion: v1
kind: Service
metadata:
  name: maildev
spec:
  selector: {app.kubernetes.io/name: maildev}
  ports:
    - {name: smtp, port: 1025, targetPort: smtp}
    - {name: http, port: 1080, targetPort: http}
