apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-lgtm
  labels: {app.kubernetes.io/name: otel-lgtm, app.kubernetes.io/part-of: elvira}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: otel-lgtm}
  template:
    metadata:
      labels: {app.kubernetes.io/name: otel-lgtm, app.kubernetes.io/part-of: elvira}
    spec:
      containers:
        - name: otel-lgtm
          image: grafana/otel-lgtm:0.39.0
          ports:
            - {name: grafana, containerPort: 3000}
            - {name: otlp-http, containerPort: 4318}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-lgtm
spec:
  selector: {app.kubernetes.io/name: otel-lgtm}
  ports:
    - {name: grafana, port: 3000, targetPort: grafana}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
