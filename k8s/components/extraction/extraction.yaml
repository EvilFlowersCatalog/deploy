apiVersion: apps/v1
kind: Deployment
metadata:
  name: text
  labels: {app.kubernetes.io/name: text, app.kubernetes.io/part-of: elvira}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: text}
  template:
    metadata:
      labels: {app.kubernetes.io/name: text, app.kubernetes.io/part-of: elvira}
    spec:
      nodeSelector: {kubernetes.io/arch: amd64}
      containers:
        - name: text
          image: ghcr.io/evilflowerscatalog/evilflowers-text-service:develop
          args: [celery, -A, evilflowers_text.worker, worker, --loglevel=INFO, -E, --concurrency=1, "--queues=evilflowers.text.paragraphs,evilflowers.text.tables,evilflowers_text_worker", --hostname=text@%h]
          env:
            - name: REDIS_URL
              valueFrom: {secretKeyRef: {name: elvira-env, key: CELERY_BROKER_URL}}
            - name: CATALOG_API_KEY
              valueFrom: {secretKeyRef: {name: elvira-env, key: EXTRACTION_API_KEY}}
            - name: TEI_URL
              valueFrom: {secretKeyRef: {name: elvira-env, key: EVILFLOWERS_EMBEDDING_URL}}
            - name: TEI_API_KEY
              valueFrom: {secretKeyRef: {name: elvira-env, key: EVILFLOWERS_EMBEDDING_API_KEY}}
            - {name: STORAGE_PATH, value: /var/local/evilflowers}
            - {name: CATALOG_API_URL, value: "http://evilflowers:8000"}
            - {name: BROKER_VISIBILITY_TIMEOUT, value: "43200"}
            - {name: TEI_BATCH_SIZE, value: "8"}
            - {name: TABLE_REVIEW_ENABLED, value: "false"}
          volumeMounts:
            - {name: data, mountPath: /var/local/evilflowers}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: data}
        - name: tmp
          emptyDir: {}
