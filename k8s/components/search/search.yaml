apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tei
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei-embed
  labels: {app.kubernetes.io/name: tei-embed, app.kubernetes.io/part-of: elvira}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: tei-embed}
  template:
    metadata:
      labels: {app.kubernetes.io/name: tei-embed, app.kubernetes.io/part-of: elvira}
    spec:
      nodeSelector: {kubernetes.io/arch: amd64}
      containers:
        - name: tei-embed
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
          args:
            - --model-id=intfloat/multilingual-e5-large-instruct
            - --revision=274baa43b0e13e37fafa6428dbc7938e62e5c439
            - --port=80
          env:
            - name: API_KEY
              valueFrom: {secretKeyRef: {name: elvira-env, key: EVILFLOWERS_EMBEDDING_API_KEY}}
          ports:
            - {name: http, containerPort: 80}
          # The model downloads on first start.
          startupProbe: {tcpSocket: {port: http}, periodSeconds: 10, failureThreshold: 180}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10}
          volumeMounts:
            - {name: tei, mountPath: /data}
      volumes:
        - name: tei
          persistentVolumeClaim: {claimName: tei}
---
apiVersion: v1
kind: Service
metadata:
  name: tei-embed
spec:
  selector: {app.kubernetes.io/name: tei-embed}
  ports:
    - {name: http, port: 80, targetPort: http}
